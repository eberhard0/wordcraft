name: Android

# Every push to `android`: cross-compile the Rust app for arm64 with cargo-ndk, then build the
# release APK + AAB with Gradle (plus a debug-signed APK for sideloading when no upload key is
# configured). Every android-v* tag: attach the signed builds to a GitHub Release.
#
# Signing needs four repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD,
# KEY_ALIAS (set with ~/hindsight-keys/set-github-secrets.sh, REPO=eberhard0/wordcraft).

on:
  push:
    branches: [android]
    tags: ['android-v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write   # attach build outputs to the release

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # craft-fonts (https://github.com/storytold/craft-fonts): the shared font assets every official
  # build embeds (the Japanese fonts). Same commit as upstream's release.yml.
  CRAFT_FONTS_REF: abb83316d96aa59c1cf64784289e378fe9fa5695
  # The NDK is the runner image's preinstalled one (ANDROID_NDK_ROOT); cargo-ndk finds it itself.
  ANDROID_API: 30

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out craft-fonts (embedded fonts)
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: >
            platforms;android-35
            build-tools;35.0.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build the Rust library (arm64)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: |
          cargo ndk --version
          echo "NDK: $ANDROID_NDK_ROOT"
          cargo ndk -t arm64-v8a --platform "$ANDROID_API" -o android/app/src/main/jniLibs \
            build --release -p wordcraft-android
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/android-v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.3.0-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle and APK
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
          # Without the upload key the release APK is unsigned (not installable);
          # build a debug-signed one as well so it can still be sideloaded.
          if [ -z "$KEYSTORE_FILE" ]; then ./gradlew --no-daemon assembleDebug; fi

      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-${{ steps.ver.outputs.name }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
